  <main class="dashboard-main" id="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-heading" id="page-heading">Add Job Listing</h1>
        <p class="page-subheading">Mock content — saved as a Pending listing for approval.</p>
      </div>
      <a href="job-listings.html" class="btn btn-secondary">Cancel</a>
    </div>

    <form class="card" id="job-listing-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="field-role">Role <span class="form-required">*</span></label>
          <input class="form-input" type="text" id="field-role" required data-error-message="Role is required.">
          <span class="form-error-text"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="field-department">Department <span class="form-required">*</span></label>
          <input class="form-input" type="text" id="field-department" required data-error-message="Department is required.">
          <span class="form-error-text"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="field-location">Location <span class="form-required">*</span></label>
          <input class="form-input" type="text" id="field-location" required data-error-message="Location is required.">
          <span class="form-error-text"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="field-type">Type <span class="form-required">*</span></label>
          <select class="form-select" id="field-type" required>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
          </select>
          <span class="form-error-text"></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="field-description">Job Description <span class="form-required">*</span></label>
        <div class="rich-text-editable" id="field-description" contenteditable="true" data-placeholder="Describe the role, responsibilities, and requirements…"></div>
        <span class="form-error-text"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="field-pdf">Job Description PDF</label>
        <input class="form-input" type="file" id="field-pdf" accept="application/pdf">
        <span class="form-help-text" id="pdf-help-text">Mock upload — the filename is stored and shown in the listing's detail drawer.</span>
      </div>

      <div class="form-group">
        <label class="form-label">Custom Fields</label>
        <div id="custom-fields-list"></div>
        <button class="btn btn-secondary btn-sm add-row-btn" id="add-custom-field-btn" type="button">+ Add field</button>
      </div>

      <div class="card-footer">
        <a href="job-listings.html" class="btn btn-secondary">Cancel</a>
        <button class="btn btn-primary" type="submit">Submit for Approval</button>
      </div>
    </form>
